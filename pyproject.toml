[project]
name = "kotoba-api"
version = "2.0.0"
description = "Kotoba JLPT N2 — FastAPI and PostgreSQL"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.36,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "pwdlib[argon2]>=0.2,<1",
  "email-validator>=2.2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
