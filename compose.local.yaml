# Optional local PostgreSQL: docker compose -f compose.yaml -f compose.local.yaml up --build -d
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kotoba}
      POSTGRES_USER: ${POSTGRES_USER:-kotoba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env for local PostgreSQL}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  api:
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kotoba}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kotoba}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
