name: Kotoba CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kotoba
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: kotoba_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kotoba -d kotoba_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://kotoba:test-password@localhost:5432/kotoba_test
      TEST_DATABASE_URL: postgresql+psycopg://kotoba:test-password@localhost:5432/kotoba_test
      KOTOBA_E2E_DATABASE_URL: postgresql+psycopg://kotoba:test-password@localhost:5432/kotoba_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.9'
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: uv sync --frozen
      - run: npm ci
      - run: uv run ruff format --check backend scripts
      - run: npm run format:check
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run python scripts/build_n2_seed.py --check
      - run: uv run pytest -q
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker build -t kotoba-ci .
